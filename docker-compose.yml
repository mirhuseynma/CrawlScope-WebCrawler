version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: crawlscope-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: CrawlScopeDb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend/CrawlScope
      dockerfile: Dockerfile
    container_name: crawlscope-backend
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # Here you should override settings for Production
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=CrawlScopeDb;Username=postgres;Password=mysecretpassword
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crawlscope-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
