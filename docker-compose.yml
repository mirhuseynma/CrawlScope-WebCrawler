version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: crawlscope-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mysecretpassword}
      POSTGRES_DB: ${DB_NAME:-CrawlScopeDb}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend/CrawlScope
      dockerfile: Dockerfile
    container_name: crawlscope-backend
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # Here you should override settings for Production
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${DB_NAME:-CrawlScopeDb};Username=${DB_USER:-postgres};Password=${DB_PASSWORD:-mysecretpassword}
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: crawlscope-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
